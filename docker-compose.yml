services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Override via a .env file next to this one (or the shell); the
      # defaults are the throwaway local-dev values. If you change them,
      # update DATABASE_URL in .env.local to match.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-houssaineamzil}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - admin-cms-postgres:/var/lib/postgresql/data
      # Creates the isolated houssaineamzil_test database (see
      # vitest.config.ts) on first container init. Postgres only runs
      # scripts in this directory against a fresh, empty data volume.
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh

volumes:
  admin-cms-postgres:
