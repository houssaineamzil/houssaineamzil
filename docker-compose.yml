services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: houssaineamzil
    ports:
      - "5433:5432"
    volumes:
      - admin-cms-postgres:/var/lib/postgresql/data

volumes:
  admin-cms-postgres:
